# Optional standalone server. Supply your own storage only when needed.
services:
  geoai-mcp:
    build: .
    ports:
      - "127.0.0.1:${GEOAI_HOST_PORT:-5001}:5001"
    environment:
      - HOST=0.0.0.0
      - PORT=5001
      - MCP_TRANSPORT=http
      - GEOAI_MESH_AUTH_TOKEN=${GEOAI_MESH_AUTH_TOKEN:-}
      - STAC_URL=${STAC_URL:-https://earth-search.aws.element84.com/v1}
      - DUCKDB_PATH=/data/geoai.duckdb
      - IMAGE_CACHE_DIR=/data/images
      - MODEL_CACHE_DIR=/data/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - USE_GPU=false
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - ALLOW_LOCAL_PARQUET_SOURCE=false
      - LOCAL_PARQUET_SOURCE_ROOT=
      - FORECAST_API_BASE_URL=${FORECAST_API_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      - FORECAST_API_KEY=${FORECAST_API_KEY:-}
    volumes:
      - geoai-data:/data
      - ./tests/live_acceptance.py:/app/tests/live_acceptance.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  geoai-data:
